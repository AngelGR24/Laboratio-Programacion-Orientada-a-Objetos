spring.application.name=videojuegos

# Configuracion de H2 en memoria (emulando MySQL)
spring.datasource.url=jdbc:h2:mem:videojuegosdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Habilitar consola web de H2 para ver las tablas
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console