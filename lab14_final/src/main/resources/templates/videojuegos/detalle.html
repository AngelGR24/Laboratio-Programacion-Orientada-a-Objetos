<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Videojuego</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/videojuegos}"><i class="bi bi-controller me-2"></i>GameVault</a>
    </div>
</nav>

<div class="container py-2">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-info text-white py-3 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="bi bi-info-circle me-2"></i>Ficha Técnica</h5>
                    <span class="badge bg-dark" th:text="'ID: ' + ${videojuego.id}"></span>
                </div>
                <div class="card-body p-4">
                    <h3 class="card-title text-primary fw-bold mb-3" th:text="${videojuego.titulo}"></h3>
                    
                    <ul class="list-group list-group-flush mb-4">
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                            <span class="text-muted"><i class="bi bi-display me-2"></i>Plataforma:</span>
                            <span class="fw-semibold" th:text="${videojuego.plataforma}"></span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                            <span class="text-muted"><i class="bi bi-tags me-2"></i>Género:</span>
                            <span class="fw-semibold" th:text="${videojuego.genero}"></span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                            <span class="text-muted"><i class="bi bi-currency-dollar me-2"></i>Precio:</span>
                            <span class="fw-semibold text-success" th:text="${'$' + #numbers.formatDecimal(videojuego.precio, 1, 2)}"></span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                            <span class="text-muted"><i class="bi bi-clock-history me-2"></i>Tiempo Invertido:</span>
                            <span class="fw-semibold" th:text="${videojuego.horasJugadas + ' horas'}"></span>
                        </li>
                    </ul>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/videojuegos}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Volver al listado
                        </a>
                        <a th:href="@{/videojuegos/editar/{id}(id=${videojuego.id})}" class="btn btn-warning">
                            <i class="bi bi-pencil-square me-1"></i> Editar
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
