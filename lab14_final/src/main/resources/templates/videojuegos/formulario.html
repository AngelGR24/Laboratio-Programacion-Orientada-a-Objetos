<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${accion}">Formulario Videojuego</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/videojuegos}"><i class="bi bi-controller me-2"></i>GameVault</a>
    </div>
</nav>

<div class="container py-2">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0 fs-5" th:text="${accion}"></h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/videojuegos/guardar}" th:object="${videojuego}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label for="titulo" class="form-label fw-semibold">Título</label>
                            <input type="text" class="form-control" id="titulo" th:field="*{titulo}" 
                                   th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid' : ''" 
                                   placeholder="Ej. The Witcher 3">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="plataforma" class="form-label fw-semibold">Plataforma</label>
                                <select class="form-select" id="plataforma" th:field="*{plataforma}"
                                        th:classappend="${#fields.hasErrors('plataforma')} ? 'is-invalid' : ''">
                                    <option value="">Selecciona...</option>
                                    <option value="PC">PC</option>
                                    <option value="PlayStation 5">PlayStation 5</option>
                                    <option value="Xbox Series X/S">Xbox Series X/S</option>
                                    <option value="Nintendo Switch">Nintendo Switch</option>
                                    <option value="Multiplataforma">Multiplataforma</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('plataforma')}" th:errors="*{plataforma}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="genero" class="form-label fw-semibold">Género</label>
                                <input type="text" class="form-control" id="genero" th:field="*{genero}"
                                       th:classappend="${#fields.hasErrors('genero')} ? 'is-invalid' : ''" 
                                       placeholder="Ej. RPG, Acción">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('genero')}" th:errors="*{genero}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="precio" class="form-label fw-semibold">Precio (MXN / USD)</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" step="0.01" class="form-control" id="precio" th:field="*{precio}"
                                           th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid' : ''" 
                                           placeholder="0.00">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="horasJugadas" class="form-label fw-semibold">Horas Jugadas</label>
                                <input type="number" class="form-control" id="horasJugadas" th:field="*{horasJugadas}"
                                       th:classappend="${#fields.hasErrors('horasJugadas')} ? 'is-invalid' : ''" 
                                       placeholder="0">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('horasJugadas')}" th:errors="*{horasJugadas}"></div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/videojuegos}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-save me-1"></i> Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
