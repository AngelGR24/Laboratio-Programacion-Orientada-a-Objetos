<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Videojuegos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/videojuegos}"><i class="bi bi-controller me-2"></i>GameVault</a>
    </div>
</nav>

<div class="container py-2">
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h3 fw-bold text-secondary mb-0">Catálogo de Juegos</h2>
        <a th:href="@{/videojuegos/nuevo}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i> Añadir Videojuego
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-3">ID</th>
                            <th>Título</th>
                            <th>Plataforma</th>
                            <th>Género</th>
                            <th>Precio</th>
                            <th>Horas</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(videojuegos)}">
                            <td colspan="7" class="text-center py-4 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-1"></i>No hay videojuegos registrados aún.
                            </td>
                        </tr>
                        <tr th:each="juego : ${videojuegos}">
                            <td class="ps-3 fw-bold" th:text="${juego.id}"></td>
                            <td class="fw-semibold text-primary" th:text="${juego.titulo}"></td>
                            <td><span class="badge bg-secondary" th:text="${juego.plataforma}"></span></td>
                            <td th:text="${juego.genero}"></td>
                            <td th:text="${'$' + #numbers.formatDecimal(juego.precio, 1, 2)}"></td>
                            <td th:text="${juego.horasJugadas + ' h'}"></td>
                            <td class="text-center">
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/videojuegos/detalle/{id}(id=${juego.id})}" class="btn btn-outline-info" title="Ver Detalle">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/videojuegos/editar/{id}(id=${juego.id})}" class="btn btn-outline-warning" title="Editar">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <a th:href="@{/videojuegos/eliminar/{id}(id=${juego.id})}" class="btn btn-outline-danger" 
                                       onclick="return confirm('¿Seguro que deseas eliminar este videojuego?');" title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
